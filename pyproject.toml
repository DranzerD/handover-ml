[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellselect"
version = "0.1.0"
description = "AI-powered intelligent test selection and prioritization for (simulated) cellular validation suites"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4",
    "joblib>=1.3",
    "pytest>=8.0,<10",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
cellselect = "cellselect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "cellular: simulated cellular validation test (validation_suite/)",
    "slow: slower integration tests",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "validation_suite"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905", "SIM108"]
